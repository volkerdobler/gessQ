name: CI

on:
    push:
        branches: [master, develop]
        tags: ['v*']
    pull_request:
        branches: [master, develop]

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: 20
                  cache: npm

            # keytar (transitive dependency of @vscode/vsce) may fall back to a
            # native build if no prebuild matches the runner.
            - name: Install libsecret
              run: sudo apt-get update && sudo apt-get install -y libsecret-1-dev

            - run: npm ci

            - name: Generated files are up to date
              run: |
                  npm run gen:language
                  git diff --exit-code -- src/data/language.ts

            - name: Type-check and lint
              run: npm run check

            - name: Unit tests
              run: npm test

            - name: Grammar tests
              run: npm run test:grammar

            - name: Production build
              run: node esbuild.js --production

            - name: Package VSIX
              run: npx vsce package

            - uses: actions/upload-artifact@v4
              with:
                  name: gessq-vsix
                  path: '*.vsix'
                  if-no-files-found: error

    integration:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-node@v4
              with:
                  node-version: 20
                  cache: npm

            - run: npm ci

            # Cache the VS Code build that @vscode/test-electron downloads.
            - name: Cache VS Code for tests
              uses: actions/cache@v4
              with:
                  path: .vscode-test
                  key: vscode-test-${{ runner.os }}

            # Extension-host tests run a real VS Code under a virtual display.
            # ubuntu-latest ships xvfb + the Electron runtime libraries; if a
            # future runner image drops one, add e.g.
            #   sudo apt-get install -y libnss3 libgbm1 libgtk-3-0 libasound2
            - name: Extension-host integration tests
              run: xvfb-run -a npm run test:integration

    publish:
        needs: [build, integration]
        if: startsWith(github.ref, 'refs/tags/v')
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: 20
                  cache: npm
            - run: sudo apt-get update && sudo apt-get install -y libsecret-1-dev
            - run: npm ci
            - name: Package VSIX
              run: npx vsce package -o gessq.vsix

            - name: Publish to VS Code Marketplace
              run: npx vsce publish --pat "$VSCE_PAT" --packagePath gessq.vsix
              env:
                  VSCE_PAT: ${{ secrets.VSCE_PAT }}

            # Open VSX (VSCodium, Cursor, Windsurf, Gitpod, code-server).
            # One-time setup: create an eclipse.org account, claim the
            # "volkerdobler" namespace (`npx ovsx create-namespace volkerdobler
            # -p <token>`), then add the token as the OVSX_PAT repo secret.
            - name: Publish to Open VSX
              run: npx ovsx publish gessq.vsix --pat "$OVSX_PAT"
              env:
                  OVSX_PAT: ${{ secrets.OVSX_PAT }}
